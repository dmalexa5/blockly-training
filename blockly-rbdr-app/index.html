<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RBDR Blockly</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>RBDR Blockly</h1>
        <div class="controls">
          <button id="runButton" type="button">Run</button>
          <button id="stopButton" type="button">Stop</button>
        </div>
      </header>
      <main class="layout">
        <section id="blocklyArea" aria-label="Blockly workspace"></section>
        <aside class="sidePanel">
          <div class="statusRow">
            <span>Status</span>
            <strong id="status">idle</strong>
          </div>
          <section>
            <h2>Python</h2>
            <pre id="codeOutput"></pre>
          </section>
          <section>
            <h2>Log</h2>
            <ol id="logOutput"></ol>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
